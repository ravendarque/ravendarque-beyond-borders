name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'
      - 'style/**'
      - 'perf/**'
      - 'chore/**'
      - 'ci/**'
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  # Detect which files changed to determine if build/test is needed
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      production-code: ${{ steps.filter.outputs.production-code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            production-code:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'test/e2e/**'
              - 'scripts/**'
              - '.github/scripts/**'
              - '.github/workflows/**'

  # Lightweight validation (security, markdown, yaml, etc.) - runs in parallel with build-and-test
  validate:
    needs: check-changes
    if: needs.check-changes.outputs.production-code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better secret scanning

      - name: Fetch main branch
        run: git fetch origin main || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: 'latest'

      - name: Security audit
        run: pwsh .github/scripts/check-security.ps1

      - name: Get changed YAML files
        id: changed-yaml
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/**/*.yml
            .github/workflows/**/*.yaml

      - name: YAML lint
        if: steps.changed-yaml.outputs.any_changed == 'true'
        run: pwsh .github/scripts/check-yaml.ps1 ${{ join(steps.changed-yaml.outputs.all_changed_files, ' ') }}

      - name: Check TODO/FIXME
        run: pwsh .github/scripts/check-todo-fixme.ps1
        continue-on-error: true

      - name: Validate file permissions
        run: pwsh .github/scripts/check-file-permissions.ps1

      - name: Check large files
        run: pwsh .github/scripts/check-large-files.ps1
        continue-on-error: true

      - name: Privacy check
        run: pwsh .github/scripts/check-privacy.ps1

      - name: Check stale references
        run: pwsh .github/scripts/check-stale-references.ps1

  # Lint, format, build, unit tests - runs first for fastest feedback (most common failures)
  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.production-code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate flag SVGs
        run: node scripts/validate-flags.js

      # Order: lint → format → build → tests (most common failures first)
      - name: Lint code
        run: pnpm run lint

      - name: Check format (Prettier)
        run: pnpm run format:check

      - name: Typecheck and build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test -- --run

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # E2E tests (full suite, all browsers) - after unit tests pass
  e2e:
    needs: [check-changes, build-and-test]
    if: needs.check-changes.outputs.production-code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (full suite, all browsers)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/playwright-report
          if-no-files-found: ignore
